# Правила линтера OpenAPI (vacuum). Берём рекомендованный набор и выключаем
# ровно два правила — с обоснованием, а не «чтобы стало зелено».
extends: [[vacuum:oas, recommended]]

rules:
  # Поля в JSON у нас snake_case: так они совпадают с именами колонок в схеме
  # и с примерами в docs/DESIGN.md, а Go-имена всё равно генерируются
  # отдельно (oapi-codegen). Смешивать два стиля в одном проекте хуже,
  # чем разойтись с дефолтом линтера.
  camel-case-properties: off

  # Пример на каждом контейнерном поле (списки, обёртки страниц) — шум:
  # у нас примеры стоят на скалярах и на ответах целиком, там где они
  # действительно объясняют формат.
  oas3-missing-example: off
